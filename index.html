<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Clavimit</title>

	<link rel="stylesheet" href="style/style.css">
	<link rel="stylesheet" href="style/side_bar.css">
</head>

<body class="sidebar">

	<main class="container">

		<header>
			<h1>Clavimit</h1>
			<p class="subtitle">
				Encrypt and decrypt Gmail messages locally.
			</p>
		</header>


		<!-- DECRYPT -->

		<details class="card" id="decryptCard">
			<summary class="card-header">
				<h2>Decrypt Email</h2>
			</summary>

			<div class="card-content">

				<label for="privateKey">
					Private Key
				</label>

				<p>
					Paste your RSA private key in PEM/PKCS#8 format,
					or load it from a file.
				</p>

				<input type="file" id="privateKeyFile" accept=".pem,.key,.txt">
				<p id="decryptError" class="error-message" role="alert" hidden></p>
				<textarea id="privateKey" rows="8" placeholder="-----BEGIN PRIVATE KEY-----"></textarea>

				<button id="dec">
					Decrypt Email
				</button>

				<label for="decryptedText" class="output-label">
					Decrypted Message
				</label>

				<textarea id="decryptedText" rows="8" readonly
					placeholder="The decrypted message will appear here."></textarea>

			</div>
		</details>


		<!-- ENCRYPT -->

		<details class="card" id="encryptCard">
			<summary class="card-header">
				<h2>Encrypt Email</h2>
			</summary>

			<div class="card-content">

				<label for="publicKey">
					Recipient Public Key
				</label>

				<p>
					Paste the recipient's RSA public key in PEM/SPKI format
					or load it from a file.
				</p>

				<input type="file" id="publicKeyFile" accept=".pem,.key,.txt">
				<p id="encryptError" class="error-message" hidden></p>
				<textarea id="publicKey" rows="8" placeholder="-----BEGIN PUBLIC KEY-----"></textarea>
				<input type="checkbox" id="encryptWithSenderPublicKey"> Keep a decryptable copy for the sender
				<div id="encryptWithSenderPublicKeyDiv" hidden>
					<input type="file", id="senderPublicKeyFile", accept=".pem,.key,.txt">
					<textarea id="senderPublicKey", rows="8", placeholder="-----BEGIN PUBLIC KEY-----"></textarea>
				</div>
				<button id="enc">
					Encrypt Email
				</button>

			</div>
		</details>

	</main>

	<script type="module" src="scripts/content.js"></script>
	<script type="module" src="scripts/sidebar.js"></script>

</body>

</html>
